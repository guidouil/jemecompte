name: CI

on:
  push:
    # main is verified once by release.yml through workflow_call on this commit.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: jemecompte
          POSTGRES_PASSWORD: jemecompte_ci
          POSTGRES_DB: jemecompte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jemecompte -d jemecompte_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgres://jemecompte:jemecompte_ci@127.0.0.1:5432/jemecompte_test
      TEST_DATABASE_URL: postgres://jemecompte:jemecompte_ci@127.0.0.1:5432/jemecompte_test
      ORIGIN: http://127.0.0.1:5175
      COUNTER_EPOCH: '1'
      REAL_EVENTS_APPROVED: 'false'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Types and service worker
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Unit and PostgreSQL integration tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and API journeys on isolated test data
        run: npm run test:e2e
      - name: Built PWA offline and reconnect
        run: npm run test:pwa
